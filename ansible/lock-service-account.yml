---
- name: Lock the service account (forced state)
  hosts: nas_admin
  become: true
  gather_facts: false
  tasks:
    # 86400 s = day 1 (1970-01-02): expired. Don't use 0, which some tools
    # read as "never expires" (see man 5 shadow).
    - name: Force account expiration
      ansible.builtin.user:
        name: "{{ jit_service_account }}"
        expires: 86400

    - name: Read the service account shadow entry
      ansible.builtin.command: "getent shadow {{ jit_service_account }}"
      register: jit_shadow
      changed_when: false

    - name: Confirm the account is locked
      ansible.builtin.assert:
        that: jit_shadow.stdout.split(':')[7] == '1'
        fail_msg: "Service account {{ jit_service_account }} is NOT locked!"
