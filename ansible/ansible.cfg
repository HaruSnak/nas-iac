[defaults]
inventory = inventories/production/inventory.yml
# vault_password_file = .vault_pass
# Refuse unknown or changed host keys (protects against man-in-the-middle)
host_key_checking = True
retry_files_enabled = False

[ssh_connection]
# SFTP is disabled on the NAS (and scp uses SFTP since OpenSSH 9):
# send files through the SSH connection directly, no failed attempts
transfer_method = piped
# Modules sent over stdin, no temporary file: faster
pipelining = True
