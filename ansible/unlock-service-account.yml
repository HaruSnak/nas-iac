---
- name: Unlock the service account (forced state)
  hosts: nas_admin
  become: true
  gather_facts: false
  tasks:
    - name: Remove account expiration
      ansible.builtin.user:
        name: "{{ jit_service_account }}"
        expires: -1

    - name: Read the service account shadow entry
      ansible.builtin.command: "getent shadow {{ jit_service_account }}"
      register: jit_shadow
      changed_when: false

    # /etc/shadow field 8 = expiration date (days since epoch), empty = never
    - name: Confirm the account is unlocked
      ansible.builtin.assert:
        that: jit_shadow.stdout.split(':')[7] == ''
        fail_msg: "Service account {{ jit_service_account }} is still expired."
