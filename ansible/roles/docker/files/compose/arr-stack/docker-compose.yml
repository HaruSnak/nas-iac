services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls319
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002  # files writable by the svc-containers group
      - TZ=${TZ}
    volumes:
      - ${DOCKER_PATH}/data/radarr/config:/config
      # Single mount: downloads and library on the same volume, so imports
      # are instant hardlinks instead of copies
      - ${MEDIA_PATH}:/data
    networks:
      - arr-vpn-net
      - arr-internal
      - arr-media-net
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002  # files writable by the svc-containers group
      - TZ=${TZ}
    volumes:
      - ${DOCKER_PATH}/data/sonarr/config:/config
      # Single mount: downloads and library on the same volume, so imports
      # are instant hardlinks instead of copies
      - ${MEDIA_PATH}:/data
    networks:
      - arr-vpn-net
      - arr-internal
      - arr-media-net
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls163
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002  # files writable by the svc-containers group
      - TZ=${TZ}
    volumes:
      - ${DOCKER_PATH}/data/prowlarr/config:/config
    networks:
      - arr-internal
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  arr-internal:
    driver: bridge
  arr-media-net:
    external: true
  arr-vpn-net:
    external: true
